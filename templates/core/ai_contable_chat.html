{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
        <div>
            <h3 class="text-primary mb-0"><i class="bi bi-robot me-2"></i>IA Contable - Fase 1</h3>
            <small class="text-muted">Asistente para consultas contables del ERP (solo lectura)</small>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div id="chat-box" class="border rounded p-3 mb-3 bg-light" style="height: 380px; overflow-y: auto;">
                <div class="mb-2">
                    <span class="badge bg-primary">ANAIRA IA</span>
                    <div class="mt-1">Hola. Puedo ayudarte con consultas contables y uso del ERP.</div>
                </div>
            </div>

            <form id="chat-form" class="row g-2">
                {% csrf_token %}
                <div class="col-md-10">
                    <input id="pregunta" type="text" class="form-control" placeholder="Ej. ¿Cómo registrar combustible sin placa sin afectar reporte por vehículo?" required>
                </div>
                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-send me-1"></i>Enviar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function () {
    const form = document.getElementById('chat-form');
    const input = document.getElementById('pregunta');
    const chatBox = document.getElementById('chat-box');
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    function addMessage(author, text, badgeClass) {
        const wrapper = document.createElement('div');
        wrapper.className = 'mb-3';

        const badge = document.createElement('span');
        badge.className = `badge ${badgeClass}`;
        badge.textContent = author;

        const content = document.createElement('div');
        content.className = 'mt-1';
        content.textContent = text;

        wrapper.appendChild(badge);
        wrapper.appendChild(content);
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const pregunta = (input.value || '').trim();
        if (!pregunta) return;

        addMessage('TÚ', pregunta, 'bg-dark');
        input.value = '';

        try {
            const body = new URLSearchParams();
            body.append('pregunta', pregunta);

            const response = await fetch("{% url 'core:ai_accounting_chat' %}", {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                },
                body: body.toString(),
            });

            const data = await response.json();
            if (data.ok) {
                addMessage('ANAIRA IA', data.respuesta || 'Sin respuesta.', 'bg-primary');
            } else {
                addMessage('SISTEMA', data.error || 'Error en la consulta.', 'bg-danger');
            }
        } catch (err) {
            addMessage('SISTEMA', 'Error de conexión con el servicio de IA.', 'bg-danger');
        }
    });
})();
</script>
{% endblock %}
