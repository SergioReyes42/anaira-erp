{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h2 class="mb-0 text-primary fw-bold">
                <i class="bi bi-calendar-check me-2"></i>Programación de Pagos
            </h2>
            <small class="text-muted">Planeación de egresos y calendario de compromisos</small>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body py-5 text-center">
            <i class="bi bi-hourglass-split text-secondary" style="font-size: 2.5rem;"></i>
            <h5 class="mt-3 mb-1">Módulo en preparación</h5>
            <p class="text-muted mb-0">
                Esta pantalla ya está habilitada en el menú y lista para integrar pagos programados.
            </p>
        </div>
    </div>
</div>
{% endblock %}
