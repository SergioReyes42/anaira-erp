{% if success %}
<div class="alert alert-success mb-0">Empleado creado correctamente. Actualizando listado...</div>
<script>
  setTimeout(function () {
    window.location.reload();
  }, 700);
</script>
{% else %}
{% if form_html %}
  {{ form_html|safe }}
{% else %}
<div class="alert alert-danger mb-0">No se pudo cargar el formulario.</div>
{% endif %}
{% endif %}
